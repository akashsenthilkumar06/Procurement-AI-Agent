[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.3.0"
description = "Configurable human–agent experiment pilot"
requires-python = ">=3.11"
dependencies = ["pypdf>=5,<7", "python-dotenv>=1,<2"]

[project.scripts]
research-agent = "research_agent.server:main"

[tool.setuptools]
packages = ["research_agent"]
