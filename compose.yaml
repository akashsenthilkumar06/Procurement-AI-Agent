services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set a researcher key in .env}
      INTEGRATION_KEY: ${INTEGRATION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SERVER_SPEND_CAP_USD: ${SERVER_SPEND_CAP_USD:-5}
      FRAME_ORIGINS: ${FRAME_ORIGINS:-}
    volumes:
      - research_data:/app/data
    expose:
      - "8765"
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      STUDY_HOST: ${STUDY_HOST:?Set the public study domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  research_data:
  caddy_data:
  caddy_config:
